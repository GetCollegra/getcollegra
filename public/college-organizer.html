<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Organizer</title>
<style>body{margin:0;padding:0;}</style>
</head>
<body>
<div id="collegra-organizer"></div>
<script>
(function () {
  const STORAGE_MODE = "session";
  const STORAGE_KEY = "collegra_organizer_v1";
  const storage = STORAGE_MODE === "device" ? window.localStorage : window.sessionStorage;

  const SAMPLE_COLLEGES = [
    { id: "uiuc", name: "University of Illinois Urbana-Champaign", location: "Champaign, IL", size: "Large", strength: "Engineering, Business" },
    { id: "iu", name: "Indiana University Bloomington", location: "Bloomington, IN", size: "Large", strength: "Business, Arts" },
    { id: "uwmadison", name: "University of Wisconsin-Madison", location: "Madison, WI", size: "Large", strength: "Research, STEM" },
    { id: "depaul", name: "DePaul University", location: "Chicago, IL", size: "Medium", strength: "Business, Media" },
    { id: "loyola", name: "Loyola University Chicago", location: "Chicago, IL", size: "Medium", strength: "Pre-Health, Business" },
    { id: "miamiOH", name: "Miami University", location: "Oxford, OH", size: "Medium", strength: "Business, Teaching" },
  ];

  const DEFAULT_STATE = {
    columns: { considering: ["uiuc", "iu", "uwmadison"], interested: ["depaul", "loyola"], top: ["miamiOH"] },
    notes: {},
    tags: {},
    createdAt: new Date().toISOString(),
  };

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      Object.entries(attrs).forEach(([k, v]) => {
        if (k === "class") node.className = v;
        else if (k === "style") node.setAttribute("style", v);
        else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v);
      });
    }
    (children || []).forEach((c) => node.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return node;
  }

  function loadState() {
    try {
      const raw = storage.getItem(STORAGE_KEY);
      if (!raw) return structuredClone(DEFAULT_STATE);
      const parsed = JSON.parse(raw);
      if (!parsed.columns || !parsed.columns.considering) return structuredClone(DEFAULT_STATE);
      return parsed;
    } catch { return structuredClone(DEFAULT_STATE); }
  }

  function saveState() {
    try { storage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  function getCollegeById(id) { return SAMPLE_COLLEGES.find((c) => c.id === id); }

  function ensureTagState(id) {
    if (!state.tags[id]) state.tags[id] = { reach: false, match: true, safety: false };
  }

  function moveCollege(collegeId, fromCol, toCol) {
    if (fromCol === toCol) return;
    state.columns[fromCol] = state.columns[fromCol].filter((id) => id !== collegeId);
    if (!state.columns[toCol].includes(collegeId)) state.columns[toCol].push(collegeId);
    saveState(); render();
  }

  function removeCollege(collegeId, fromCol) {
    state.columns[fromCol] = state.columns[fromCol].filter((id) => id !== collegeId);
    saveState(); render();
  }

  function resetDemo() { state = structuredClone(DEFAULT_STATE); saveState(); render(); }

  function addCollegeById(collegeId, targetCol) {
    Object.keys(state.columns).forEach((col) => {
      state.columns[col] = state.columns[col].filter((id) => id !== collegeId);
    });
    state.columns[targetCol].push(collegeId);
    saveState(); render();
  }

  function createCard(collegeId, currentCol, filterText) {
    const c = getCollegeById(collegeId);
    if (!c) return null;
    const haystack = (c.name + " " + c.location + " " + c.size + " " + c.strength).toLowerCase();
    if (filterText && !haystack.includes(filterText)) return null;
    ensureTagState(collegeId);
    const tag = state.tags[collegeId];
    const notesValue = state.notes[collegeId] || "";

    const tagBtn = (label, key) =>
      el("button", { class: "co-tag-btn", "data-active": tag[key] ? "true" : "false", onclick: () => { ensureTagState(collegeId); state.tags[collegeId][key] = !state.tags[collegeId][key]; saveState(); render(); }, title: "Toggle tag" }, [label]);

    const actionBtn = (label, toCol) =>
      el("button", { class: "co-btn", onclick: () => moveCollege(collegeId, currentCol, toCol) }, [label]);

    const removeBtn = el("button", { class: "co-btn co-btn-ghost", onclick: () => removeCollege(collegeId, currentCol) }, ["Remove"]);

    const notes = el("textarea", { class: "co-notes", placeholder: "Add a quick note (demo preview)...", rows: "2" });
    notes.value = notesValue;
    notes.addEventListener("input", () => { state.notes[collegeId] = notes.value; saveState(); });

    const actions = el("div", { class: "co-actions" }, [
      currentCol !== "considering" ? actionBtn("To Considering", "considering") : null,
      currentCol !== "interested" ? actionBtn("To Interested", "interested") : null,
      currentCol !== "top" ? actionBtn("To Top Choices", "top") : null,
      removeBtn,
    ].filter(Boolean));

    const tags = el("div", { class: "co-tags" }, [
      el("span", { class: "co-tags-label" }, ["Tags:"]),
      tagBtn("Reach", "reach"), tagBtn("Match", "match"), tagBtn("Safety", "safety"),
    ]);

    return el("div", { class: "co-card", draggable: "true" }, [
      el("div", { class: "co-card-title" }, [c.name]),
      el("div", { class: "co-card-meta" }, ["\u{1F4CD} " + c.location + "  \u2022  \u{1F393} " + c.size]),
      el("div", { class: "co-card-meta" }, ["\u2B50 Strength: " + c.strength]),
      tags, notes, actions,
    ]);
  }

  function allowDrop(colKey, dropZone) {
    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("co-drop-active"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("co-drop-active"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault(); dropZone.classList.remove("co-drop-active");
      const payload = e.dataTransfer.getData("text/plain");
      if (!payload) return;
      try { const { id, from } = JSON.parse(payload); moveCollege(id, from, colKey); } catch {}
    });
  }

  function attachDragHandlers(root) {
    root.querySelectorAll(".co-column").forEach((col) => {
      const colKey = col.getAttribute("data-col");
      const dropZone = col.querySelector(".co-cards");
      allowDrop(colKey, dropZone);
    });
    root.querySelectorAll(".co-card").forEach((card) => {
      card.addEventListener("dragstart", (e) => {
        const colEl = card.closest(".co-column");
        const colKey = colEl.getAttribute("data-col");
        const title = card.querySelector(".co-card-title")?.textContent || "";
        const college = SAMPLE_COLLEGES.find((x) => x.name === title);
        if (!college) return;
        e.dataTransfer.setData("text/plain", JSON.stringify({ id: college.id, from: colKey }));
        e.dataTransfer.effectAllowed = "move";
      });
    });
  }

  function render() {
    const mount = document.getElementById("collegra-organizer");
    if (!mount) return;
    mount.innerHTML = "";

    const style = el("style", null, [
      "#collegra-organizer { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; color: hsl(213 40% 18%); }" +
      ".co-wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }" +
      ".co-banner { border-radius: 14px; padding: 14px 18px; background: linear-gradient(135deg, hsl(210 90% 96%), hsl(210 60% 92%)); border: 1px solid hsl(210 50% 85%); margin-bottom: 14px; }" +
      ".co-banner h2 { margin: 0 0 4px 0; font-size: 20px; color: hsl(210 85% 35%); }" +
      ".co-banner p { margin: 0; opacity: 0.85; line-height: 1.35; }" +
      ".co-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0 16px; }" +
      ".co-search { flex: 1; min-width: 220px; border-radius: 12px; border: 1px solid hsl(210 30% 82%); padding: 10px 14px; font-size: 14px; outline: none; transition: border-color 150ms; }" +
      ".co-search:focus { border-color: hsl(210 85% 55%); box-shadow: 0 0 0 3px hsl(210 85% 55% / 0.15); }" +
      ".co-btn { border-radius: 10px; border: 1px solid hsl(210 30% 82%); background: white; padding: 9px 14px; font-size: 13px; cursor: pointer; font-weight: 500; color: hsl(210 60% 35%); transition: all 150ms; }" +
      ".co-btn:hover { background: hsl(210 50% 96%); border-color: hsl(210 60% 70%); }" +
      ".co-btn-ghost { background: transparent; color: hsl(0 70% 50%); border-color: hsl(0 40% 80%); }" +
      ".co-btn-ghost:hover { background: hsl(0 60% 96%); }" +
      ".co-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }" +
      "@media (max-width: 900px) { .co-grid { grid-template-columns: 1fr; } }" +
      ".co-column { border-radius: 16px; border: 1px solid hsl(210 30% 86%); overflow: hidden; background: hsl(210 30% 98%); }" +
      ".co-col-head { padding: 14px 16px 12px; display: flex; justify-content: space-between; align-items: center; }" +
      ".co-col-head.col-considering { background: linear-gradient(135deg, hsl(210 70% 50%), hsl(210 80% 60%)); }" +
      ".co-col-head.col-interested { background: linear-gradient(135deg, hsl(200 75% 45%), hsl(195 70% 55%)); }" +
      ".co-col-head.col-top { background: linear-gradient(135deg, hsl(160 60% 40%), hsl(170 55% 50%)); }" +
      ".co-col-head h3 { margin: 0; font-size: 15px; font-weight: 700; color: white; letter-spacing: 0.3px; text-transform: uppercase; }" +
      ".co-count { font-size: 11px; background: rgba(255,255,255,0.25); color: white; padding: 3px 10px; border-radius: 999px; font-weight: 600; }" +
      ".co-cards { padding: 12px; min-height: 180px; transition: background 120ms ease; }" +
      ".co-drop-active { background: hsl(210 50% 93%); border-radius: 12px; }" +
      ".co-card { border-radius: 14px; border: 1px solid hsl(210 30% 88%); background: white; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 10px hsl(210 50% 30% / 0.07); cursor: grab; transition: box-shadow 150ms, transform 150ms; }" +
      ".co-card:hover { box-shadow: 0 4px 16px hsl(210 50% 30% / 0.12); transform: translateY(-1px); }" +
      ".co-card:active { cursor: grabbing; transform: scale(0.98); }" +
      ".co-card-title { font-weight: 700; margin-bottom: 6px; color: hsl(210 60% 30%); }" +
      ".co-card-meta { font-size: 13px; opacity: 0.75; margin-bottom: 6px; line-height: 1.25; }" +
      ".co-tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }" +
      ".co-tags-label { font-size: 12px; opacity: 0.65; margin-right: 2px; font-weight: 500; }" +
      ".co-tag-btn { border-radius: 999px; border: 1px solid hsl(210 30% 85%); background: white; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all 150ms; font-weight: 500; }" +
      ".co-tag-btn:hover { border-color: hsl(210 60% 65%); }" +
      ".co-tag-btn[data-active='true'] { background: hsl(210 80% 50%); color: white; border-color: hsl(210 80% 50%); }" +
      ".co-notes { width: 100%; border-radius: 12px; border: 1px solid hsl(210 30% 85%); padding: 10px; font-size: 13px; resize: vertical; box-sizing: border-box; outline: none; transition: border-color 150ms; }" +
      ".co-notes:focus { border-color: hsl(210 85% 55%); box-shadow: 0 0 0 3px hsl(210 85% 55% / 0.12); }" +
      ".co-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }" +
      ".co-footer { margin-top: 16px; border-radius: 14px; border: 1px solid hsl(210 30% 86%); padding: 14px 18px; background: linear-gradient(135deg, hsl(210 50% 97%), hsl(210 40% 94%)); }" +
      ".co-footer p { margin: 0; line-height: 1.4; opacity: 0.9; }" +
      ".co-mini { font-size: 12px; opacity: 0.6; margin-top: 8px; }"
    ]);

    const wrap = el("div", { class: "co-wrap" });
    const banner = el("div", { class: "co-banner" }, [
      el("h2", null, ["Your College Organizer (Preview)"]),
      el("p", null, ["Try sorting colleges into lists. " + (STORAGE_MODE === "session" ? "This demo does not save after you close the tab." : "This demo saves on this device only. It is not a real login.")]),
    ]);

    const controls = el("div", { class: "co-controls" }, [resetBtn]);

    const col = (key, title) => {
      const cards = (state.columns[key] || []).map((id) => createCard(id, key, ui.filter)).filter(Boolean);
      const cardsWrap = el("div", { class: "co-cards" }, cards.length ? cards : [
        el("div", { style: "opacity:0.65; font-size:13px; padding: 6px 2px;" }, ["Drop a college here or add one above."])
      ]);
      return el("div", { class: "co-column", "data-col": key }, [
        el("div", { class: "co-col-head col-" + key }, [el("h3", null, [title]), el("div", { class: "co-count" }, [state.columns[key].length + " item(s)"])]),
        cardsWrap,
      ]);
    };

    const grid = el("div", { class: "co-grid" }, [col("considering", "Considering"), col("interested", "Interested"), col("top", "Top Choices")]);

    wrap.appendChild(style);
    wrap.appendChild(banner);
    wrap.appendChild(controls);
    wrap.appendChild(grid);
    mount.appendChild(wrap);
    attachDragHandlers(mount);
  }

  let ui = { filter: "" };
  let state = loadState();
  saveState();
  render();
})();
</script>
</body>
</html>
